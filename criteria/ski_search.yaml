search_name: "K2 Way Back 92 Search"
enabled: true
priority: high

item_type: skis

keywords:
  required:
    - "K2"
    - ["Way Back", "Wayback", "WayBack"]
  optional:
    - "92"
    - "touring"
    - "backcountry"
  exclude:
    - "broken"
    - "cracked"
    - "parts only"
    - "damaged"
    - "core shot"

specifications:
  model:
    - "Way Back"
    - "Wayback"
    - "Way-Back"
  
  width_underfoot:
    min: 90
    max: 94
    preferred: 92
    unit: mm
  
  length:
    min: 160
    max: 168
    preferred: [162, 164, 166]
    unit: cm
    notes: "1.6-1.68m range preferred"
  
  condition:
    accepted:
      - "new"
      - "like new"
      - "excellent"
      - "very good"
      - "good"
      - "used"
    excluded:
      - "for parts"
      - "damaged"
      - "poor"

price:
  max: 500
  currency: USD
  alert_if_below: 250
  notes: "Alert immediately if under $250"

location:
  max_distance: 180  # ~3 hours driving from NYC
  unit: miles
  from: "10001"  # NYC ZIP - UPDATE to your exact location
  
  preferred_regions:
    - "New York"
    - "New Jersey"
    - "Pennsylvania"
    - "Connecticut"
    - "Massachusetts"
    - "Vermont"
    - "New Hampshire"
  
  notes: "Within ~3 hours of NYC, or willing to pay for shipping"

marketplaces:
  - name: "craigslist"
    enabled: true
    regions:
      - "newyork"        # NYC
      - "newjersey"      # North Jersey
      - "jerseyshore"    # Shore area
      - "philadelphia"   # PA
      - "poconos"        # PA mountains
      - "hudsonvalley"   # NY
      - "longisland"     # NY
      - "westchester"    # NY
      - "newhaven"       # CT
      - "hartford"       # CT
      - "albany"         # NY
      - "vermont"        # VT (ski country!)
      - "newhampshire"   # NH (ski country!)
      - "boston"         # MA
  
  - name: "ebay"
    enabled: true
    notes: "Nationwide shipping, focus on 'local pickup' or reasonable shipping"
  
  - name: "facebook"
    enabled: true
    notes: "NYC metro area and surrounding ski regions"
  
  - name: "shopgoodwill"
    enabled: true
    notes: "Nationwide auctions, often great deals on used gear"

notification:
  telegram: true
  email: false
  
  match_threshold: 0.6  # Only notify if match score >= 60%
  
  urgency_indicators:
    great_price_threshold: 250
    just_posted_minutes: 60
    local_distance_miles: 50  # Within 50 miles = very urgent

search_frequency:
  interval: 15
  unit: minutes

notes: |
  Looking for K2 Way Back 92 skis for backcountry touring.
  Length range: 160-168cm (1.6-1.68m)
  Width: 92mm preferred, but 90-94mm acceptable
  Condition: Good or better
  Price: Under $500, ideally under $250
  
  Location: NYC area, willing to drive ~3 hours (includes VT/NH ski country)
  Also open to shipping from anywhere in US via eBay/ShopGoodwill

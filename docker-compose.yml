version: '3.8'

services:
  ski-search:
    build: .
    container_name: ski-marketplace-search
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///data/ski_search.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./cache:/app/cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ski-search-network

  # Optional: PostgreSQL database for production
  # Uncomment if you want to use PostgreSQL instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ski-search-db
  #   restart: unless-stopped
  #   environment:
  #     - POSTGRES_USER=skisearch
  #     - POSTGRES_PASSWORD=your_secure_password_here
  #     - POSTGRES_DB=ski_search
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - ski-search-network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U skisearch"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  ski-search-network:
    driver: bridge

